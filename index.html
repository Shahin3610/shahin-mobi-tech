<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHIN MOBI TECH</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Box -->
    <div class="bg-white shadow-xl rounded-xl p-6 w-full max-w-md border border-slate-200">
        
        <!-- App Title -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600 tracking-wide">SHAHIN MOBI TECH</h1>
            <p class="text-xs text-slate-500 mt-1">Management & Service Portal</p>
        </div>

        <!-- Notification Message Box -->
        <div id="alertBox" class="hidden-section mb-4 p-3 rounded text-sm text-center font-medium"></div>

        <!-- 1. REGISTER FORM -->
        <div id="registerSection">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2">Create Account</h2>
            
            <!-- Step 1: Input Details -->
            <div id="regStep1" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Mobile Number</label>
                    <input type="tel" id="regMobile" placeholder="e.g. 9876543210" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="sendOTP()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition">Send OTP</button>
            </div>

            <!-- Step 2: OTP Verification -->
            <div id="regStep2" class="space-y-4 hidden-section">
                <div>
                    <label class="block text-sm font-medium mb-1">Enter OTP</label>
                    <input type="text" id="regOTP" placeholder="Enter 4-digit OTP (e.g. 1234)" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center tracking-widest text-lg">
                    <p class="text-xs text-slate-400 mt-1 text-center">Demo OTP: <span class="font-bold text-slate-600">1234</span></p>
                </div>
                <button onclick="verifyOTPAndRegister()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-medium transition">Verify OTP & Register</button>
            </div>

            <p class="text-xs text-center mt-4 text-slate-600">
                Already have an account? <a href="#" onclick="showLogin()" class="text-blue-600 font-semibold hover:underline">Login here</a>
            </p>
        </div>

        <!-- 2. LOGIN FORM -->
        <div id="loginSection" class="hidden-section">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2">Login</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Mobile Number</label>
                    <input type="tel" id="loginMobile" placeholder="Enter mobile number" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="loginUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition">Login</button>
            </div>

            <p class="text-xs text-center mt-4 text-slate-600">
                Don't have an account? <a href="#" onclick="showRegister()" class="text-blue-600 font-semibold hover:underline">Register now</a>
            </p>
        </div>

        <!-- 3. DASHBOARD (AFTER LOGIN) -->
        <div id="dashboardSection" class="hidden-section text-center py-4">
            <div class="mb-4">
                <span class="inline-block p-3 bg-green-100 text-green-600 rounded-full mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </span>
                <h2 class="text-xl font-bold text-slate-800">Welcome, <span id="userDisplayName">User</span>!</h2>
                <p class="text-sm text-slate-500 mt-1">You are successfully logged in to SHAHIN MOBI TECH.</p>
            </div>

            <div class="bg-slate-50 p-4 rounded-lg border mb-4 text-left text-sm space-y-1">
                <p><strong>Mobile:</strong> <span id="userDisplayMobile"></span></p>
                <p><strong>Status:</strong> <span class="text-green-600 font-semibold">Active Member</span></p>
            </div>

            <button onclick="logoutUser()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-medium transition">Logout</button>
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Utility for Alerts
        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('alertBox');
            box.innerText = msg;
            box.className = `mb-4 p-3 rounded text-sm text-center font-medium ${isSuccess ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            box.classList.remove('hidden-section');
        }

        function clearAlert() {
            document.getElementById('alertBox').classList.add('hidden-section');
        }

        // View Toggles
        function showLogin() {
            clearAlert();
            document.getElementById('registerSection').classList.add('hidden-section');
            document.getElementById('loginSection').classList.remove('hidden-section');
            document.getElementById('dashboardSection').classList.add('hidden-section');
        }

        function showRegister() {
            clearAlert();
            document.getElementById('loginSection').classList.add('hidden-section');
            document.getElementById('registerSection').classList.remove('hidden-section');
            document.getElementById('dashboardSection').classList.add('hidden-section');
            document.getElementById('regStep1').classList.remove('hidden-section');
            document.getElementById('regStep2').classList.add('hidden-section');
        }

        // Registration Flow
        function sendOTP() {
            const name = document.getElementById('regName').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !mobile || !password) {
                showAlert('Please fill in all details.');
                return;
            }

            if (mobile.length < 10) {
                showAlert('Please enter a valid mobile number.');
                return;
            }

            // Check if user already exists in localStorage
            const existingUsers = JSON.parse(localStorage.getItem('smt_users') || '{}');
            if (existingUsers[mobile]) {
                showAlert('Mobile number already registered. Please login.');
                return;
            }

            // Move to OTP Step
            document.getElementById('regStep1').classList.add('hidden-section');
            document.getElementById('regStep2').classList.remove('hidden-section');
            showAlert('OTP sent successfully to your mobile number! (Use demo OTP: 1234)', true);
        }

        function verifyOTPAndRegister() {
            const otp = document.getElementById('regOTP').value.trim();
            const name = document.getElementById('regName').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            // Demo OTP Validation
            if (otp !== '1234') {
                showAlert('Invalid OTP. Please enter 1234.');
                return;
            }

            // Save User Record
            const users = JSON.parse(localStorage.getItem('smt_users') || '{}');
            users[mobile] = { name: name, password: password };
            localStorage.setItem('smt_users', JSON.stringify(users));

            showAlert('Registration successful! Please login.', true);
            setTimeout(() => {
                showLogin();
            }, 1200);
        }

        // Login Flow
        function loginUser() {
            const mobile = document.getElementById('loginMobile').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!mobile || !password) {
                showAlert('Please enter mobile number and password.');
                return;
            }

            const users = JSON.parse(localStorage.getItem('smt_users') || '{}');
            const user = users[mobile];

            if (!user) {
                showAlert('Mobile number not found. Please register first.');
                return;
            }

            if (user.password !== password) {
                showAlert('Incorrect password.');
                return;
            }

            // Set Active Session
            localStorage.setItem('smt_session', JSON.stringify({ name: user.name, mobile: mobile }));
            loadDashboard();
        }

        // Dashboard & Session Management
        function loadDashboard() {
            const session = JSON.parse(localStorage.getItem('smt_session') || 'null');
            if (session) {
                clearAlert();
                document.getElementById('registerSection').classList.add('hidden-section');
                document.getElementById('loginSection').classList.add('hidden-section');
                document.getElementById('dashboardSection').classList.remove('hidden-section');
                document.getElementById('userDisplayName').innerText = session.name;
                document.getElementById('userDisplayMobile').innerText = session.mobile;
            }
        }

        function logoutUser() {
            localStorage.removeItem('smt_session');
            showLogin();
            showAlert('Logged out successfully.', true);
        }

        // Auto-check session on page load
        window.onload = function() {
            const session = JSON.parse(localStorage.getItem('smt_session') || 'null');
            if (session) {
                loadDashboard();
            }
        };
    </script>
</body>
</html>
