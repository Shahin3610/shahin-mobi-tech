<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAHIN MOBI TECH - Billing & Profit Manager</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f7f6;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .header {
      text-align: center;
      border-bottom: 2px solid #007bff;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #007bff;
      font-size: 26px;
      text-transform: uppercase;
    }

    .header p {
      color: #555;
      font-size: 14px;
    }

    .customer-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
      background: #eef5ff;
      padding: 15px;
      border-radius: 6px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .input-group input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    table th, table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    table th {
      background-color: #007bff;
      color: white;
    }

    table input {
      width: 100%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-add {
      background-color: #28a745;
      color: white;
    }

    .btn-remove {
      background-color: #dc3545;
      color: white;
      padding: 4px 8px;
    }

    .btn-print {
      background-color: #17a2b8;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
    }

    .summary-box {
      float: right;
      width: 320px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .summary-row.total {
      font-weight: bold;
      font-size: 16px;
      border-top: 1px solid #ccc;
      padding-top: 8px;
      color: #007bff;
    }

    .summary-row.profit {
      font-weight: bold;
      color: #28a745;
    }

    .clear {
      clear: both;
    }

    /* Print styling rules */
    @media print {
      .btn, .btn-remove, .cost-col, .profit-row, .cost-row {
        display: none !important;
      }
      body {
        background: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        border: none;
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>SHAHIN MOBI TECH</h1>
    <p>Nagarbera, Kamrup, Assam - 781127 | Phone: 7086992870</p>
  </div>

  <div class="customer-details">
    <div class="input-group">
      <label>Customer Name:</label>
      <input type="text" id="custName" placeholder="Enter customer name">
    </div>
    <div class="input-group">
      <label>Customer Mobile:</label>
      <input type="text" id="custPhone" placeholder="Enter phone number">
    </div>
  </div>

  <table id="billTable">
    <thead>
      <tr>
        <th style="width: 35%;">Item Description</th>
        <th style="width: 10%;">Qty</th>
        <th class="cost-col" style="width: 15%;">Cost Price (₹)</th>
        <th style="width: 15%;">Selling Price (₹)</th>
        <th style="width: 15%;">Total (₹)</th>
        <th style="width: 10%;">Action</th>
      </tr>
    </thead>
    <tbody id="itemList">
      <tr class="item-row">
        <td><input type="text" class="item-desc" placeholder="Display, Battery, Repair Service"></td>
        <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateRows()"></td>
        <td class="cost-col"><input type="number" class="item-cost" value="0" min="0" oninput="calculateRows()"></td>
        <td><input type="number" class="item-price" value="0" min="0" oninput="calculateRows()"></td>
        <td class="item-total">0.00</td>
        <td><button type="button" class="btn btn-remove" onclick="removeRow(this)">X</button></td>
      </tr>
    </tbody>
  </table>

  <button type="button" class="btn btn-add" onclick="addRow()">+ Add Item</button>

  <div class="summary-box">
    <div class="summary-row cost-row">
      <span>Total Cost (কেনা দাম):</span>
      <span>₹<span id="totalCost">0.00</span></span>
    </div>
    <div class="summary-row total">
      <span>Grand Total (বিক্রি):</span>
      <span>₹<span id="grandTotal">0.00</span></span>
    </div>
    <div class="summary-row profit">
      <span>Net Profit (মোট লাভ):</span>
      <span>₹<span id="totalProfit">0.00</span></span>
    </div>
  </div>

  <div class="clear"></div>
  <br>
  <button type="button" class="btn btn-print" onclick="window.print()">Print Receipt</button>
</div>

<script>
  function addRow() {
    const tbody = document.getElementById('itemList');
    const tr = document.createElement('tr');
    tr.className = 'item-row';
    tr.innerHTML = `
      <td><input type="text" class="item-desc" placeholder="Display, Battery, Repair Service"></td>
      <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateRows()"></td>
      <td class="cost-col"><input type="number" class="item-cost" value="0" min="0" oninput="calculateRows()"></td>
      <td><input type="number" class="item-price" value="0" min="0" oninput="calculateRows()"></td>
      <td class="item-total">0.00</td>
      <td><button type="button" class="btn btn-remove" onclick="removeRow(this)">X</button></td>
    `;
    tbody.appendChild(tr);
  }

  function removeRow(btn) {
    const row = btn.closest('tr');
    const tbody = document.getElementById('itemList');
    if (tbody.rows.length > 1) {
      row.remove();
      calculateRows();
    }
  }

  function calculateRows() {
    let grandTotal = 0;
    let totalCost = 0;

    const rows = document.querySelectorAll('.item-row');
    rows.forEach(row => {
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const cost = parseFloat(row.querySelector('.item-cost').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;

      const rowTotal = qty * price;
      const rowCostTotal = qty * cost;

      row.querySelector('.item-total').innerText = rowTotal.toFixed(2);

      grandTotal += rowTotal;
      totalCost += rowCostTotal;
    });

    const totalProfit = grandTotal - totalCost;

    document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
    document.getElementById('totalCost').innerText = totalCost.toFixed(2);
    document.getElementById('totalProfit').innerText = totalProfit.toFixed(2);
  }
</script>

</body>
</html>
