<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Invoice Management</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #4a5568;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        table th, table td {
            border: 1px solid #cbd5e0;
            padding: 10px;
            text-align: left;
        }

        table th {
            background-color: #f7fafc;
        }

        .totals {
            width: 100%;
            max-width: 350px;
            margin-left: auto;
            margin-top: 20px;
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .totals-row.grand-total {
            font-weight: bold;
            font-size: 18px;
            border-top: 2px solid #cbd5e0;
            padding-top: 10px;
            color: #2b6cb0;
        }

        .btn {
            background-color: #3182ce;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #2b6cb0;
        }

        .btn-add {
            background-color: #38a169;
            margin-top: 10px;
        }

        .btn-add:hover {
            background-color: #2f855a;
        }

        @media print {
            body {
                background-color: #ffffff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                max-width: 100%;
                padding: 0;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Invoice</h2>

    <!-- Customer Selection -->
    <div class="form-group">
        <label for="customerSelect">Select Customer:</label>
        <select id="customerSelect" onchange="handleCustomerSelect()">
            <option value="">-- Select Customer --</option>
            <option value="1">John Doe (Mobile: 9876543210)</option>
            <option value="2">Jane Smith (Mobile: 9123456789)</option>
        </select>
    </div>

    <!-- Items Table -->
    <table id="invoiceTable">
        <thead>
            <tr>
                <th>Item Description</th>
                <th style="width: 100px;">Qty</th>
                <th style="width: 120px;">Price (₹)</th>
                <th style="width: 120px;">Total (₹)</th>
                <th style="width: 60px;" class="no-print">Action</th>
            </tr>
        </thead>
        <tbody id="itemList">
            <tr>
                <td><input type="text" class="item-desc" placeholder="Item name"></td>
                <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateTotals()"></td>
                <td><input type="number" class="item-price" value="0" min="0" oninput="calculateTotals()"></td>
                <td class="item-total">0.00</td>
                <td class="no-print"><button class="btn" style="background:#e53e3e; padding:5px 10px;" onclick="removeRow(this)">X</button></td>
            </tr>
        </tbody>
    </table>

    <button class="btn btn-add no-print" onclick="addRow()">+ Add Item</button>

    <!-- Calculation Section -->
    <div class="totals">
        <div class="totals-row">
            <span>Subtotal:</span>
            <span>₹<span id="subtotal">0.00</span></span>
        </div>
        <div class="totals-row">
            <span>Discount (₹):</span>
            <input type="number" id="discountInput" value="0" min="0" style="width: 100px; text-align: right;" oninput="calculateTotals()">
        </div>
        <div class="totals-row grand-total">
            <span>Grand Total:</span>
            <span>₹<span id="grandTotal">0.00</span></span>
        </div>
    </div>

    <div style="margin-top: 30px;" class="no-print">
        <button class="btn" onclick="window.print()">Print Invoice</button>
    </div>
</div>

<script>
    // Selected customer handle (No pending balance processing)
    function handleCustomerSelect() {
        const customerId = document.getElementById('customerSelect').value;
        if (!customerId) return;
        
        // Custom logic for customer selection can go here
        calculateTotals();
    }

    // Add new item row to table
    function addRow() {
        const tbody = document.getElementById('itemList');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="item-desc" placeholder="Item name"></td>
            <td><input type="number" class="item-qty" value="1" min="1" oninput="calculateTotals()"></td>
            <td><input type="number" class="item-price" value="0" min="0" oninput="calculateTotals()"></td>
            <td class="item-total">0.00</td>
            <td class="no-print"><button class="btn" style="background:#e53e3e; padding:5px 10px;" onclick="removeRow(this)">X</button></td>
        `;
        tbody.appendChild(tr);
    }

    // Remove row
    function removeRow(btn) {
        const row = btn.closest('tr');
        row.parentNode.removeChild(row);
        calculateTotals();
    }

    // Calculate Subtotal & Grand Total without any pending balance addition
    function calculateTotals() {
        const rows = document.querySelectorAll('#itemList tr');
        let subtotal = 0;

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            const total = qty * price;
            
            row.querySelector('.item-total').textContent = total.toFixed(2);
            subtotal += total;
        });

        const discount = parseFloat(document.getElementById('discountInput').value) || 0;
        const grandTotal = Math.max(0, subtotal - discount);

        document.getElementById('subtotal').textContent = subtotal.toFixed(2);
        document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
    }

    // Initial calculation on page load
    calculateTotals();
</script>

</body>
</html>
